<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>AniBase - онлайн каталог аниме</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

            <div class="search"> 
                <input type="text" id="search" placeholder="Поиск">
                <div class="burger">
                    <i class="fa-solid fa-bars"></i> 
                </div>
            </div>

    <div class="container">


        <aside class="sidebar">
            <h2 class="">Поиск</h2>

            <div class="filter__container">
                <h3>Жанры</h3>
                <div id="genre">

                </div>
            </div>

            <div class="filter__container">
                <h3>Студии</h3>
                <div id="studios">

                </div>
            </div>
            <div class="filter__container">
                <h3>Год</h3>
                <div id="year">

                </div>
            </div>

            <div class="filter__container">
                <h3>Возраст</h3>
                <div id="age">

                </div>
            </div>
                        <div class="filter__container">
                <h3>Сезон</h3>
                <div id="season">

                </div>
            </div>


        </aside>
        <div class="content">
            <div class="card__nav"></div>
            <div class="card__grid"></div>



        </div>
    </div>

    <script type="module" src="js/app.js"></script>
    <script src="https://kit.fontawesome.com/71c864647a.js" crossorigin="anonymous"></script>

</body>

</html>
