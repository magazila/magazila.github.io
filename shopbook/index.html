<!doctype html>
<html lang="ru">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shopbook</title>
    <link rel="stylesheet" href="css/style.css" />
</head>

<body class="light">

    <div class="change__theme">
        <!-- Кнопка светлой темы -->
        <button class="theme-btn light" data-id="light" aria-label="Включить светлую тему">
            <svg xmlns="http://w3.org" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor"
                stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="5"></circle>
                <line x1="12" y1="1" x2="12" y2="3"></line>
                <line x1="12" y1="21" x2="12" y2="23"></line>
                <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                <line x1="1" y1="12" x2="3" y2="12"></line>
                <line x1="21" y1="12" x2="23" y2="12"></line>
                <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
            </svg>
        </button>

        <!-- Кнопка темной темы -->
        <button class="theme-btn dark" data-id="dark" aria-label="Включить темную тему">
            <svg xmlns="http://w3.org" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor"
                stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
            </svg>
        </button>
    </div>

    <header class="header">
        <div class="container">
            <figure class="header__logo">«Переплёт»</figure>
            <input type="text" id="search__book" placeholder="Поиск по названию или автору">
            <div class="header__other">
                <div class="header__favorite">
                    <svg xmlns="http://w3.org" viewBox="0 0 24 24" width="24" height="24" fill="white"
                        stroke="currentColor" stroke-width="0">
                        <path
                            d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z">
                        </path>
                    </svg>
                </div>
                <div class="header__vallet">
                    <svg xmlns="http://w3.org" viewBox="0 0 24 24" width="24" height="24" fill="white"
                        stroke="currentColor" stroke-width="0">
                        <path
                            d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z">
                        </path>
                    </svg>
                </div>
            </div>

        </div>
    </header>


    <main>


        <div class="container banner">
            <h1 class="banner__title">«Книги, которые остаются с тобой»</h1>
            <p class="banner__subtitle"></p>
        </div>

        <div class="container main__container">
            <div class="sidebar">
                <div class="filter__genre">
                    <h3 class="select__genre">Жанры</h3>
                    <label>
                        <input type="checkbox" value="Роман"> Роман </label>

                    </label>
                </div>
                <div class="filter__price">
                    <h3 class="select__price">Цена</h3>
                    <label>
                        <p>От</p>
                        <input type="number" placeholder="От" id="min_price">

                    </label>
                    <label>
                        <p>До</p>
                        <input type="number" placeholder="До" id="min_price">

                    </label>
                </div>
            </div>


            <div class="book__content">

                <div class="book__grid">




                </div>

            </div>
        </div>
    </main>


    <script type="module" src="js/main.js"></script>
</body>

</html>
