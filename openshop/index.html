<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="css/style.css" />
    <title>Online Book Shop</title>
  </head>
  <body>
    <header class="header">
      <div class="container">
        <h3 class="header__logo">ПЕРЕПЛЕТ</h3>
        <div class="header__search">
          <input
            type="text"
            name=""
            id="header__search"
            placeholder="Поиск по книги или автору"
          />
        </div>
        <div class="header__orher">
          <div class="favorite">
            <i class="fa-solid fa-heart">
              <div class="favorite__count">0</div>
            </i>
          </div>
          <div class="cart">
            <i class="fa-solid fa-cart-shopping">
              <div class="cart__count">0</div>
            </i>
          </div>
        </div>
      </div>
    </header>
    <div class="banner">
      <h1 class="banner__title">Книги, которые остаются с тобой</h1>
      <p class="banner__subtitle">Lorem ipsum dolor sit</p>
    </div>

    <div class="content">
      <div class="container">
        <div class="content__left">
          <p class="content__left-title">Фильтры</p>
          <div class="ganre__list"></div>
        </div>
        <div class="container__right">
          <div class="card__grid">

          </div>
          <button type="button" class="showMoreCard"></button>
        </div>
      </div>
    </div>

    <script type="module" src="js/app.js"></script>

    <script
      src="https://kit.fontawesome.com/71c864647a.js"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
