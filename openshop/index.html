<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <title>Online Book Shop</title>
</head>
<body>


<header class="header">
    <div class="container container__header">
        <div class="header__logo">Переплет</div>
        <div class="header__search"><input type="text" name="search" id="search" placeholder="Поиск по авторы или книге"></div>
        <div class="header__other">
            <figure class="favorite">❤
                <div class="count"></div>
            </figure>
            <figure class="wallet">🛒
                <div class="count"></div>
                    
            </figure>
        </div>
    </div>
</header>


<div class="banner"></div>
<div class="container container__main">
    <div class="left__col">
        <h2 class="sidebar__name"> Жанры</h2>
        <div class="ganre__list"></div>
        <p class="genre__open">показать все</p>
        
    </div>
    <div class="right__col">
        <div class="book__nav"></div>
        <div class="book__grid"></div>
    </div>
</div>


<script type="module" src="js/app.js"></script>

</body>
</html>
